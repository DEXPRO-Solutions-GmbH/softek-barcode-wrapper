name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Used by the release workflow, which runs the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    name: PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: ffi
        tools: composer

    - name: Validate composer.json
      run: composer validate --strict

    - name: Get the Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    # There is no composer.lock (this is a library), so the cache is keyed by composer.json.
    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
        restore-keys: composer-${{ matrix.php }}-

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-interaction

    # Deprecations are raised while PHP compiles a file, e.g. implicitly nullable parameters (PHP 8.4).
    - name: Lint sources and fail on deprecations
      run: |
        status=0
        while IFS= read -r -d '' file; do
          output=$(php -d error_reporting=-1 -d display_errors=1 -d log_errors=0 -l "$file" 2>&1) || status=1
          if grep -qE '^(Deprecated|Warning|Fatal error|Parse error)' <<< "$output"; then
            echo "$output"
            status=1
          fi
        done < <(find src -name '*.php' -print0)
        exit $status

    # PHP 8.4 deprecates calling these statically. The SDK is not available in CI, so
    # no test would notice them: they only show when a barcode is scanned.
    - name: Forbid static FFI::new(), FFI::cast() and FFI::type() calls
      run: |
        if grep -rnE 'FFI::(new|cast|type)\(' src; then
          echo "::error::Call these on the FFI instance instead, static calls are deprecated since PHP 8.4"
          exit 1
        fi

    - name: Run Psalm
      run: vendor/bin/psalm --find-unused-psalm-suppress --no-progress

name: Release

# Publishes a GitHub release when a version tag is pushed, see "Releases" in the README.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check the version format
      run: |
        if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
          echo "::error::'$GITHUB_REF_NAME' is not a version tag: use vMAJOR.MINOR.PATCH, optionally followed by -alpha.N, -beta.N or -rc.N"
          exit 1
        fi

    - name: Check that the tag is on main
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Tag '$GITHUB_REF_NAME' is not part of main, only release what was merged"
          exit 1
        fi

  test:
    name: Test
    needs: verify
    uses: ./.github/workflows/main.yml

  release:
    name: Create the release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # The release notes are generated from the merged pull requests since the previous tag.
    # A tag with a suffix such as -rc.1 is marked as pre-release.
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        flags=(--generate-notes --verify-tag --title "$GITHUB_REF_NAME")
        if [[ "$GITHUB_REF_NAME" == *-* ]]; then
          flags+=(--prerelease)
        fi
        gh release create "$GITHUB_REF_NAME" "${flags[@]}"
